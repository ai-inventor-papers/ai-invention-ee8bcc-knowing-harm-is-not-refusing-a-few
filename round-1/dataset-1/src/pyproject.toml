[project]
name = "safety-screen-dataset-bundle"
version = "1.0.0"
description = "Canonical prompt corpus + model zoo evidence bundle for the LLM safety-screening experiment (probe/B1/B2 splits, interpolation anchors, verified model zoo manifest)."
requires-python = ">=3.12"
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "datasets==5.0.1",
    "dill==0.4.1",
    "filelock==4.0.1",
    "frozenlist==1.8.0",
    "fsspec==2026.6.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.32.0",
    "idna==3.20",
    "loguru==0.7.3",
    "multidict==6.9.0",
    "multiprocess==0.70.19",
    "numpy==2.5.3",
    "packaging==26.3",
    "pandas==3.0.6",
    "propcache==0.5.4",
    "pyarrow==25.0.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "six==1.17.0",
    "tqdm==4.70.1",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    "xxhash==4.0.1",
    "yarl==1.25.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["data.py"]